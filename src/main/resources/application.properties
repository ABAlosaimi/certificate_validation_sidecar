spring.application.name=certvalidator

# Identity keystore for the sidecar's own TLS certificate
keys.default.keymanager.password=${APP_KEYMANAGER_PW:changeit}
keys.default.keymanager.container.format=${APP_KEYMANAGER_KEYSTORE_FORMAT:PKCS12}

# SAN allow-list — comma-separated DNS names / IPs the sidecar accepts as valid clients
cert.san.allow=${APP_CERT_SAN_ALLOW}

# URL to redirect to after successful certificate validation
cert.redirect.url=${APP_CERT_REDIRECT_URL}
